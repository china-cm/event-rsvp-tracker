name: API Contract Testing (Pact)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run consumer contract test
        run: npm run test:contract:consumer

      - name: Upload pact file
        uses: actions/upload-artifact@v4
        with:
          name: pact-file
          path: backend/contracts/pacts/*.json

  provider:
    needs: consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download pact file
        uses: actions/download-artifact@v4
        with:
          name: pact-file
          path: backend/contracts/pacts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install contract verifier dependencies
        working-directory: backend/contracts
        run: npm ci

      - name: Build and start API provider
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000

      - name: Verify provider against pact
        working-directory: backend/contracts
        env:
          PROVIDER_BASE_URL: http://localhost:3000
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
        run: npm run test:contract:provider
